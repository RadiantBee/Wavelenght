plugins {
	id 'org.springframework.boot' version '4.2.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
}

group = 'com.backend.wavelenght'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// Build with JDK 25 but keep the produced bytecode compatible with Java 17.
tasks.withType(JavaCompile).configureEach {
	options.release = 17
}

repositories {
	mavenCentral()
}

ext {
	cxfVersion = "4.2.4"
}

// ---------------------------------------------------------------------------
// Frontend (React + Vite)
//
// `./gradlew build` installs the npm dependencies, builds the React app and
// packages the result into the Spring Boot jar. Node.js 18+ and npm are
// required on the machine running the build.
// ---------------------------------------------------------------------------
def frontendDir = file("$projectDir/frontend")
def npmExecutable = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('npmInstall', Exec) {
	group = 'frontend'
	description = 'Install frontend dependencies with npm.'
	workingDir frontendDir
	inputs.files(
			new File(frontendDir, 'package.json'),
			new File(frontendDir, 'package-lock.json')
	)
	outputs.dir(new File(frontendDir, 'node_modules'))
	commandLine npmExecutable, 'ci', '--no-audit', '--no-fund'
}

tasks.register('npmBuild', Exec) {
	group = 'frontend'
	description = 'Build the React frontend with Vite.'
	dependsOn tasks.named('npmInstall')
	workingDir frontendDir
	inputs.dir(new File(frontendDir, 'src'))
	inputs.files(
			new File(frontendDir, 'index.html'),
			new File(frontendDir, 'vite.config.js'),
			new File(frontendDir, 'package.json'),
			new File(frontendDir, 'package-lock.json')
	)
	outputs.dir(layout.buildDirectory.dir('frontend'))
	commandLine npmExecutable, 'run', 'build'
}

// Serve the generated frontend from the Spring Boot static resources.
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('frontend'))

tasks.named('processResources') {
	dependsOn tasks.named('npmBuild')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-activemq'
	// Required for the embedded ActiveMQ broker (Boot's starter is client-only)
	implementation 'org.apache.activemq:activemq-broker'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.1'

	// The application code uses Jackson 2 directly; Spring Boot 4 uses Jackson 3 by default.
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.google.code.gson:gson'

	// cxf
	implementation "org.apache.cxf:cxf-rt-transports-http:$cxfVersion"
	implementation "org.apache.cxf:cxf-rt-frontend-jaxws:$cxfVersion"
	implementation "org.apache.cxf:cxf-rt-databinding-aegis:$cxfVersion"
	implementation "org.apache.cxf:cxf-spring-boot-autoconfigure:$cxfVersion"

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
	// The project currently has no active tests.
	failOnNoDiscoveredTests = false
}
